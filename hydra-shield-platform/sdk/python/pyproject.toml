[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrashield"
version = "0.1.0"
description = "Stdlib-only client for the HydraShield public REST API (hydrashield.earth)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "HydraShield Earth Systems" }]
keywords = ["climate", "wildfire", "risk", "api", "client"]
dependencies = []

[tool.setuptools.packages.find]
include = ["hydrashield*"]
