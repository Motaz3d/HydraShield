[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrashield"
version = "0.2.0"
description = "Stdlib-only client for the Talaix public REST API (talaix.com)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Talaix Earth Systems" }]
keywords = ["climate", "wildfire", "risk", "api", "client"]
dependencies = []

[project.scripts]
talaix = "hydrashield.cli:main"

[tool.setuptools.packages.find]
include = ["hydrashield*"]
