<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where to Invest — moved | Talaix</title>
    <meta name="description" content="Siting and funding intelligence now live inside Investment & Siting Intelligence.">
    <link rel="canonical" href="https://talaix.com/intelligence.html">
    <meta name="robots" content="noindex, follow">
</head>
<body>
    <p>
        Siting &amp; funding now live inside
        <a id="movedLink" href="intelligence.html">Investment &amp; Siting Intelligence</a> —
        redirecting…
    </p>
    <script>
    /* Legacy entry points preserved:
     *   solutions.html?mode=funding&hazards=…  → intelligence.html?mode=funding&hazards=…
     *   solutions.html?location=…              → intelligence.html?mode=siting&location=…
     *   solutions.html                         → intelligence.html?mode=siting */
    (function () {
        var p = new URLSearchParams(location.search);
        var mode = p.get('mode') === 'funding' ? 'funding' : 'siting';
        var target = 'intelligence.html?mode=' + mode;
        var loc = p.get('location');
        if (loc) target += '&location=' + encodeURIComponent(loc);
        var hz = p.get('hazards');
        if (hz) target += '&hazards=' + encodeURIComponent(hz);
        document.getElementById('movedLink').href = target;
        location.replace(target);
    })();
    </script>
</body>
</html>
