<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Sources | Talaix — Climate Extreme Intelligence</title>
    <meta name="description" content="Every data source Talaix has evaluated — integrated, candidate or rejected, with provider, resolution, license, limitations and official links.">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16.png">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="sources">
    <div id="site-header"></div>

    <main class="page-main">
        <div class="container">
            <h1>Data Sources</h1>
            <p class="page-lead">
                Every source Talaix has evaluated — integrated, candidate or rejected,
                with provider, resolution, license and limitations. Nothing is claimed as
                used unless it is integrated. Machine-readable form:
                <a href="/api/sources" target="_blank" rel="noopener">/api/sources</a>.
            </p>
            <div id="statusArea"></div>
            <div id="sourcesArea"></div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/api.js"></script>
    <script src="js/chrome.js"></script>
    <script>
    (function () {
        'use strict';
        var esc = HS.esc, fetchJSON = HS.fetchJSON, API = HS.API;
        var statusOrder = { integrated: 0, candidate: 1, rejected: 2 };
        fetchJSON(API + '/sources').then(function (res) {
            if (!res.ok || !res.body.sources) {
                document.getElementById('statusArea').innerHTML =
                    '<div class="notice notice-error">Source registry unavailable.</div>';
                return;
            }
            var sources = res.body.sources.slice().sort(function (a, b) {
                return (statusOrder[a.status] || 9) - (statusOrder[b.status] || 9);
            });
            document.getElementById('statusArea').innerHTML =
                '<div class="notice notice-info">' + sources.length +
                ' evaluated sources · audit date ' + esc(res.body.audit_date || '—') + '</div>';
            document.getElementById('sourcesArea').innerHTML =
                '<div class="table-scroll"><table class="data-table"><thead><tr>' +
                '<th>Source</th><th>Status</th><th>Provider</th><th>Purpose</th>' +
                '<th>Resolution</th><th>License</th><th>Limitations</th><th>Link</th>' +
                '</tr></thead><tbody>' +
                sources.map(function (s) {
                    return '<tr><td><strong>' + esc(s.name) + '</strong></td>' +
                        '<td>' + esc(s.status) + '</td>' +
                        '<td>' + esc(s.provider || '—') + '</td>' +
                        '<td>' + esc(s.purpose || '—') + '</td>' +
                        '<td>' + esc(s.resolution || '—') + '</td>' +
                        '<td>' + esc(s.license || '—') + '</td>' +
                        '<td>' + esc(s.limitations || '—') + '</td>' +
                        '<td><a class="text-link" href="' + esc(s.url) +
                        '" target="_blank" rel="noopener">official →</a></td></tr>';
                }).join('') + '</tbody></table></div>';
        }).catch(function () {
            document.getElementById('statusArea').innerHTML =
                '<div class="notice notice-error">Source registry could not be reached.</div>';
        });
    })();
    </script>
</body>
</html>
