# Talaix production stack.
# One server, one deploy command, three faces of the product:
#   - talaix.com        -> static marketing site (website/)
#   - talaix.com/api/*  -> REST API (Flask via gunicorn)
#   - app.talaix.com    -> live interactive Dash dashboard (gunicorn)
#
# Caddy terminates HTTPS automatically (Let's Encrypt) and routes traffic.
#
# Optional environment (set in .env next to this file — never commit it):
#   FIRMS_MAP_KEY   NASA FIRMS API key for the active-fire layer (free)
#   SMTP_HOST/PORT/USER/PASSWORD/FROM   transactional email (info@talaix.com)
#   CONTACT_INBOX                     platform inbox (contact/operator messages)
#   HYDRASHIELD_SECRET_KEY            HMAC key for session/verification tokens
#   STRIPE_SECRET_KEY/WEBHOOK_SECRET/PUBLISHABLE_KEY   Stripe billing (api only)
#   TALAIX_PUBLIC_BASE_URL            public base URL for checkout redirects
#   SMS_PROVIDER/HTTP_URL/FROM/API_KEY/API_SECRET/AUTH_HEADER  SMS alert provider
#   HYDRASHIELD_CACHE_DB            cache/watch DB path (default in image)
#   HYDRASHIELD_POPULATION_DIR      WorldPop raster cache (default /data/population,
#                                   persisted on the hydrashield_data volume)

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./website:/srv/website:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dash:
        condition: service_started
      api:
        condition: service_started
    networks:
      - hydrashield

  dash:
    build: .
    restart: unless-stopped
    command: >
      gunicorn --workers 2 --threads 2 --timeout 180 --graceful-timeout 30
      --bind 0.0.0.0:8050 wsgi:dash_server
    environment:
      - PORT=8050
      - HYDRASHIELD_CACHE_DB=/data/hydrashield_cache.sqlite3
    volumes:
      - hydrashield_data:/data
    expose:
      - "8050"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8050/', timeout=5)\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hydrashield

  api:
    build: .
    restart: unless-stopped
    command: >
      gunicorn --workers 2 --threads 4 --timeout 180 --graceful-timeout 30
      --bind 0.0.0.0:8051 wsgi:api_app
    environment:
      - PORT=8051
      - HYDRASHIELD_CACHE_DB=/data/hydrashield_cache.sqlite3
      # Dev-backend emails (verification etc.) persist on the data volume so
      # they survive rebuilds and stay retrievable until SMTP is configured.
      - HYDRASHIELD_OUTBOX_DIR=/data/outbox
      - HYDRASHIELD_POPULATION_DIR=${HYDRASHIELD_POPULATION_DIR:-/data/population}
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - CONTACT_INBOX=${CONTACT_INBOX:-}
      - HYDRASHIELD_SECRET_KEY=${HYDRASHIELD_SECRET_KEY:-}
      - HYDRASHIELD_OPERATOR_EMAILS=${HYDRASHIELD_OPERATOR_EMAILS:-}
      # Stripe billing — values live only in the server .env, never in git.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - TALAIX_PUBLIC_BASE_URL=${TALAIX_PUBLIC_BASE_URL:-https://talaix.com}
      # AI gateway (Kimi) — value lives only in the server .env, never in git.
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - KIMI_PROVIDER=${KIMI_PROVIDER:-code}
      - KIMI_BASE_URL=${KIMI_BASE_URL:-}
      - KIMI_MODEL_CHEAP=${KIMI_MODEL_CHEAP:-}
      - KIMI_MODEL_STRONG=${KIMI_MODEL_STRONG:-}
      - AI_DAILY_CALL_CAP=${AI_DAILY_CALL_CAP:-50}
      # Marketing CRM — Hunter fallback layer + outreach send cap.
      - HUNTER_API_KEY=${HUNTER_API_KEY:-}
      - DAILY_SEND_CAP=${DAILY_SEND_CAP:-20}
      # IMAP reply inbox (Phase 18)
      - IMAP_HOST=${IMAP_HOST:-}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USER=${IMAP_USER:-}
      - IMAP_PASS=${IMAP_PASS:-}
      - IMAP_PASSWORD=${IMAP_PASSWORD:-}
      - IMAP_FOLDER=${IMAP_FOLDER:-INBOX}
      - SMS_PROVIDER=${SMS_PROVIDER:-}
      - SMS_HTTP_URL=${SMS_HTTP_URL:-}
      - SMS_FROM=${SMS_FROM:-}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - SMS_API_SECRET=${SMS_API_SECRET:-}
      - SMS_HTTP_AUTH_HEADER=${SMS_HTTP_AUTH_HEADER:-}
    volumes:
      - hydrashield_data:/data
      # Marketing workspace (leads, campaigns, funding radar) — bind-mounted
      # read-only so the Commercial Center sees live data without rebuilding
      # the image (the workspace stays out of the image itself).
      - ./marketing:/code/marketing:ro
    expose:
      - "8051"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8051/api/health', timeout=5)\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hydrashield

  # Periodic watch checker (Phase 5 alerts): runs the watch evaluation loop
  # every 30 minutes using the same image and the shared data volume. Also
  # refreshes the public risk-snapshot cache so the homepage bar is always
  # served from cache.
  watch_checker:
    build: .
    restart: unless-stopped
    command: >
      sh -c "while true; do python scripts/check_watches.py; python scripts/check_alert_rules.py; python scripts/check_source_health.py; python -u scripts/build_risk_snapshot.py; sleep 1800; done"
    environment:
      - HYDRASHIELD_CACHE_DB=/data/hydrashield_cache.sqlite3
      - HYDRASHIELD_OUTBOX_DIR=/data/outbox
      - HYDRASHIELD_POPULATION_DIR=${HYDRASHIELD_POPULATION_DIR:-/data/population}
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - CONTACT_INBOX=${CONTACT_INBOX:-}
      - HYDRASHIELD_SECRET_KEY=${HYDRASHIELD_SECRET_KEY:-}
      - SMS_PROVIDER=${SMS_PROVIDER:-}
      - SMS_HTTP_URL=${SMS_HTTP_URL:-}
      - SMS_FROM=${SMS_FROM:-}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - SMS_API_SECRET=${SMS_API_SECRET:-}
      - SMS_HTTP_AUTH_HEADER=${SMS_HTTP_AUTH_HEADER:-}
      # IMAP reply inbox (Phase 18)
      - IMAP_HOST=${IMAP_HOST:-}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USER=${IMAP_USER:-}
      - IMAP_PASS=${IMAP_PASS:-}
      - IMAP_PASSWORD=${IMAP_PASSWORD:-}
      - IMAP_FOLDER=${IMAP_FOLDER:-INBOX}
    volumes:
      - hydrashield_data:/data
    networks:
      - hydrashield

volumes:
  caddy_data:
  caddy_config:
  hydrashield_data:

networks:
  hydrashield:
