name: Deploy to Vultr

on:
  push:
    branches: [main]
    paths:
      - 'hydra-shield-platform/**'
  workflow_dispatch:

jobs:
  test:
    # Quality gate: the fully offline test suite must pass before any
    # production deploy. No green tests, no deploy.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd hydra-shield-platform
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run offline test suite
        run: |
          cd hydra-shield-platform
          python -m pytest tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy files to Vultr via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          source: "hydra-shield-platform/*, hydra-shield-platform/.dockerignore"
          target: "/opt/hydrashield/"
          strip_components: 1

      - name: Rebuild and restart stack over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            cd /opt/hydrashield
            # Operator identity (public contact email, not a credential):
            # ensure the server env enables the operator promotion for the
            # official mailbox. Idempotent; the file itself stays out of Git.
            touch .env && chmod 600 .env
            if ! grep -q '^HYDRASHIELD_OPERATOR_EMAILS=' .env; then
              echo 'HYDRASHIELD_OPERATOR_EMAILS=info@hydrashield.earth' >> .env
            fi
            docker compose pull
            docker compose build
            docker compose up -d --remove-orphans
            # Caddy's config is a bind-mounted file; compose does not
            # recreate the container when only the file changes — restart
            # it explicitly so Caddyfile changes take effect.
            docker compose restart caddy
            docker image prune -f
            docker compose ps
            echo "Waiting for stack to settle..."
            sleep 20
            for i in 1 2 3 4 5; do
              if curl -fsS https://hydrashield.earth/api/health > /tmp/hs_health.json; then
                echo "Production health check OK:" && cat /tmp/hs_health.json && exit 0
              fi
              echo "Health check attempt $i failed; retrying in 15s..."
              sleep 15
            done
            echo "ERROR: production health check failed after deploy" && exit 1